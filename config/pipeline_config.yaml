# Automatic Fractal Generation Pipeline Configuration
# Based on Youvan (2024) "AI-Enhanced Fractal Geometry"

# Pipeline Settings
pipeline:
  output_dir: "dataset"
  parallel_workers: 4
  target_images: 1000

# Quality Evaluation (from Paper Section 6)
quality:
  # Composite score threshold
  quality_threshold: 0.65

  # Fractal dimension thresholds (Paper Section 6.1)
  fractal_dimension:
    min: 1.2
    max: 1.8
    box_sizes: [2, 4, 8, 16, 32, 64]

  # Shannon entropy threshold (Paper Section 6.4)
  entropy:
    min: 3.0
    max: 5.0

  # Statistical properties (Paper Section 6.1)
  variance:
    min_std: 50.0
    max_std: 100.0

  # Edge density (Paper Section 4.2)
  edge_density:
    min: 0.05
    max: 0.40
    canny_threshold_low: 50
    canny_threshold_high: 150

  # Multi-scale analysis (Paper Section 6.1)
  multiscale:
    scales: [1.0, 0.5, 0.25]

  # Scoring weights
  weights:
    fractal_dimension: 0.35
    entropy: 0.25
    variance: 0.20
    edge_density: 0.15
    multiscale: 0.05

# Parameter Sampling
sampling:
  strategy: "mixed"  # 'uniform', 'interesting', 'zoom', 'mixed'

  mandelbrot:
    # Interesting regions for Mandelbrot
    regions:
      - center: [-0.7, 0.0]
        range: 2.0
        name: "main_bulb"
      - center: [-0.1, 0.65]
        range: 0.5
        name: "north_antenna"
      - center: [0.285, 0.0]
        range: 0.3
        name: "east_valley"
      - center: [-0.75, 0.1]
        range: 0.5
        name: "west_bulb"

    # Parameter ranges
    ranges:
      xmin: [-2.5, 1.0]
      xmax: [-2.5, 1.0]
      ymin: [-1.5, 1.5]
      ymax: [-1.5, 1.5]
      width: [400, 1200]
      height: [400, 1200]
      max_iter: [128, 512]

  julia:
    # Interesting Julia set parameters
    regions:
      - c: [-0.7, 0.27]
        range: 3.0
        name: "classic"
      - c: [-0.4, 0.6]
        range: 3.0
        name: "dendrite"
      - c: [0.285, 0.01]
        range: 3.0
        name: "rabbit"
      - c: [-0.8, 0.156]
        range: 3.0
        name: "dragon"

    # Parameter ranges
    ranges:
      c_real: [-1.0, 1.0]
      c_imag: [-1.0, 1.0]
      xmin: [-2.0, 2.0]
      xmax: [-2.0, 2.0]
      ymin: [-2.0, 2.0]
      ymax: [-2.0, 2.0]
      width: [400, 1200]
      height: [400, 1200]
      max_iter: [128, 512]

# Augmentation (future)
augmentation:
  enabled: false
  rotations: [0, 90, 180, 270]
  flips: [horizontal, vertical]
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]

# Output Format
output:
  image_format: "png"
  save_fractals: true
  save_shorelines: true
  save_metadata: true
  metadata_format: "json"

# Logging
logging:
  level: "INFO"
  save_logs: true
  log_file: "pipeline.log"
