# relative paths
region_evaluated_dir: dataset/region/evaluated
output_dir: dataset/rgb
job_type: rgb

detector:
  canny_low: 50
  canny_high: 150
  apply_smoothing: true
  smoothing_method: gaussian
  smoothing_kernel: 5
  smoothing_sigma: 0.0

evaluator:
  quality_threshold: 0.3
  min_edge_ratio: 0.03
  max_edge_ratio: 0.45
  min_inside_ratio: 0.0001
  max_inside_ratio: 0.9999

hires_gen:
  width: 512
  height: 512
  max_iter: 1024
  use_supersampling: false
  device: cuda
