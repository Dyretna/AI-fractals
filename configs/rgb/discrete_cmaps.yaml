job_type: rgb

detector:
  canny_low: 40
  canny_high: 120
  apply_smoothing: true
  smoothing_method: gaussian
  smoothing_kernel: 3
  smoothing_sigma: 0.8

evaluator:
  quality_threshold: 0.3
  min_edge_ratio: 0.03
  max_edge_ratio: 0.45
  min_inside_ratio: 0.0001
  max_inside_ratio: 0.9999

tile_gen:
  width: 256
  height: 256
  max_iter: 2048
  use_supersampling: false
  device: cuda

search_strategy: tile_jittered
search_params:
  n_tiles: 7
  top_k: 5
  jitter_scale: 0.05

hires_gen:
  width: 2048
  height: 2048
  max_iter: 4096
  use_supersampling: true
  device: cuda

batch_img_gen: 400
min_depth: 3
max_depth: 10

fractal_types:
  - mandelbrot

colormap_group: discrete_gradients
