job_type: shoreline

detector:
  canny_low: 50
  canny_high: 150
  apply_smoothing: true
  smoothing_method: gaussian
  smoothing_kernel: 5
  smoothing_sigma: 0.0

evaluator:
  quality_threshold: 0.3
  min_edge_ratio: 0.03
  max_edge_ratio: 0.45
  min_inside_ratio: 0.0001
  max_inside_ratio: 0.9999

tile_gen:
  width: 256
  height: 256
  max_iter: 512
  use_supersampling: false
  device: cuda

search_strategy: tile_jittered
search_params:
  n_tiles: 7
  top_k: 5
  jitter_scale: 0.05

hires_gen:
  width: 512
  height: 512
  max_iter: 512
  use_supersampling: false
  device: cuda

batch_img_gen: 2000
min_depth: 1
max_depth: 8

fractal_types:
  - mandelbrot
