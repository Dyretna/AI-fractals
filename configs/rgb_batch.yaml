detector:
  canny_low: 40
  canny_high: 120
  apply_smoothing: true
  smoothing_method: gaussian
  smoothing_kernel: 3
  smoothing_sigma: 0.8

evaluator:
  quality_threshold: 0.3
  min_edge_ratio: 0.03
  max_edge_ratio: 0.45
  min_inside_ratio: 0.0001
  max_inside_ratio: 0.9999

tile_gen:
  width: 256
  height: 256
  max_iter: 256
  use_supersampling: false
  use_gpu: true

tile:
  n_tiles: 7
  top_k: 5
  jitter_scale: 0.05

hires_gen:
  width: 1024
  height: 1024
  use_supersampling: true
  use_gpu: true

total_final: 10000
min_depth: 2
max_depth: 10

fractal_types:
  - mandelbrot

max_iters:
  - 512
  - 1024
  - 2048
