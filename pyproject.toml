[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fractals"
version = "0.1.0"
description = """
AI-fractal generator, based on:
-------------------------------
'AI-Enhanced Fractal Geometry: Merging Machine Learning with Traditional Fractal Mathematics'

Author: Douglas C. Youvan
mail: doug@youvan.com
"""
readme = "Readme.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Jesper Anteryd", email = "jesper.anteryd@proton.me"},
]
keywords = ["ai", "fractals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Python devs / AI devs / Artists",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Fractals/Arts",
]
dependencies = [
    "numpy>=2.2.0",
    "opencv-python>=4.13.0",
    "matplotlib>=3.10.0",
    "pillow>=12.1.0",
    "scikit-image>=0.22.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.0.0",
    "pre-commit>=4.6.0",
]

[project.urls]
Repository = "https://github.com/Dyretna/AI-fractals"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
